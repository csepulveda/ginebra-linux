# Ginebra Linux - configuracion del sistema
# Este archivo lo genera 'mia' al crear los disquetes (persistencia: solo en el disquete).

HOSTNAME=ginebra

# Red: dhcp o static
NET_MODE=dhcp
NET_IFACE=eth0
# Solo para NET_MODE=static
NET_IP=192.168.100.99
NET_NETMASK=255.255.255.0
NET_GATEWAY=
NET_DNS=

# Driver de red: auto, 8139too, 8139cp, ne2k-pci
NIC=auto

# Servidor de paquetes de Bali (vacio = bali pregunta)
BALI_URL=
